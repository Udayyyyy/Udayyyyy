  <text x="78" y="94" fill="#F5F1E9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="54" font-weight="650" letter-spacing="-1.7">Uday Radadiya</text>
  <text x="36" y="136" fill="#B9BEC6" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">evals / environments / edge cases</text>
